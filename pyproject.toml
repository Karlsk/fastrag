[project]
name = "fastrag"
version = "0.1.0"
description = "A modular RAG engine with extensible document processing, retrieval, and low-code pipeline."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "openai>=1.0",
    "tiktoken>=0.7",
    "numpy>=1.24",
]

[project.optional-dependencies]
pdf = ["pdfplumber>=0.10"]
docx = ["python-docx>=1.0"]
html = ["beautifulsoup4>=4.12", "html5lib"]
excel = ["openpyxl>=3.1", "pandas>=2.0"]
milvus = ["pymilvus>=2.4"]
rerank-local = ["sentence-transformers>=3.0"]
all = [
    "pdfplumber>=0.10",
    "python-docx>=1.0",
    "beautifulsoup4>=4.12",
    "html5lib",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "pymilvus>=2.4",
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastrag"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
