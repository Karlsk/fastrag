services:
  fastrag-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fastrag-app
    ports:
      - "8501:8501"
    env_file:
      - ../.env
    environment:
      # Override: inside Docker network, use service name instead of localhost
      FASTRAG_MILVUS_URI: http://milvus:19530
    depends_on:
      milvus:
        condition: service_healthy
    networks:
      - fastrag-net
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    container_name: fastrag-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd
      -advertise-client-urls=http://etcd:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - fastrag-net
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: fastrag-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/9000'"]
      interval: 30s
      start_period: 10s
      timeout: 10s
      retries: 3
    networks:
      - fastrag-net
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.6.12
    container_name: fastrag-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - fastrag-net
    restart: unless-stopped

volumes:
  etcd_data:
  minio_data:
  milvus_data:

networks:
  fastrag-net:
    driver: bridge
